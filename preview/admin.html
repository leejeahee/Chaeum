<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>채움 어드민 — 공식 위치 추가</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Kakao Maps API (https 고정 + autoload=false → kakao.maps.load()로 수동 초기화) -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=bc704e6eafb7cbfbf1ffc6989d74d88c&autoload=false"></script>
</head>
<body>
  <header class="admin-header">
    <h1>🛠️ 채움 어드민 — 공식 위치 추가</h1>
    <div class="warning-banner hidden" id="supabase-warning">
      ⚠️ Supabase가 설정되지 않았습니다. 저장이 비활성화됩니다. (supabase_init.js 설정 필요)
    </div>
  </header>

  <main class="admin-body">
    <!-- ── 좌: 지도 ── -->
    <section class="map-pane">
      <div id="admin-map"></div>
      <p class="map-hint">📍 지도를 클릭하면 위도/경도가 자동 입력됩니다.</p>
    </section>

    <!-- ── 우: 입력 폼 + 최근 목록 ── -->
    <section class="form-pane">
      <h2 class="pane-title">위치 정보</h2>
      <div class="form-grid">
        <label class="field">
          <span class="field-label">상호명 <em>*</em></span>
          <input type="text" id="name" placeholder="예: 정자 로스터리 카페">
        </label>

        <div class="field-row">
          <label class="field">
            <span class="field-label">위도(lat) <em>*</em></span>
            <input type="text" id="lat" inputmode="decimal" placeholder="37.3610">
          </label>
          <label class="field">
            <span class="field-label">경도(lng) <em>*</em></span>
            <input type="text" id="lng" inputmode="decimal" placeholder="127.1121">
          </label>
        </div>

        <div class="field-row">
          <label class="field">
            <span class="field-label">카테고리</span>
            <select id="category">
              <option value="카페" selected>카페</option>
              <option value="식당">식당</option>
              <option value="기타">기타</option>
            </select>
          </label>
          <label class="field field-emoji">
            <span class="field-label">이모지</span>
            <input type="text" id="emoji" maxlength="4" placeholder="📍">
          </label>
        </div>

        <label class="field">
          <span class="field-label">주소</span>
          <input type="text" id="address" placeholder="예: 성남시 분당구 ...">
        </label>

        <p class="form-error hidden" id="form-error"></p>

        <button type="button" class="submit-btn" id="submit-btn">위치 추가</button>
      </div>

      <h2 class="pane-title recent-title">최근 추가된 장소</h2>
      <p class="recent-empty" id="recent-empty">아직 추가된 장소가 없습니다.</p>
      <ul class="recent-list" id="recent-list"></ul>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <!-- Scripts -->
  <script src="supabase_init.js"></script>
  <script src="admin.js"></script>
</body>
</html>
